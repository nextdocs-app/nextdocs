services:
  nextdocs-api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/nextdocs}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-nextdocs}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-nextdocs}
      # DDL is managed by Flyway; Hibernate only validates the schema
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      # JWT — must be overridden in production: openssl rand -base64 32
      - JWT_SECRET=${JWT_SECRET:-CHANGE_ME_IN_PRODUCTION}
      - JWT_ACCESS_EXPIRY_MS=${JWT_ACCESS_EXPIRY_MS:-900000}
      - JWT_REFRESH_EXPIRY_MS=${JWT_REFRESH_EXPIRY_MS:-604800000}
      # OAuth token encryption at rest (AES-GCM) — must be overridden in production
      - OAUTH_TOKEN_ENCRYPTION_KEY_BASE64=${OAUTH_TOKEN_ENCRYPTION_KEY_BASE64:-CHANGE_ME_IN_PRODUCTION}
      # CORS
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Set COOKIE_SECURE=true behind HTTPS in production
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Uploaded files live on the attachments_data volume (back up with the database)
      - ATTACHMENT_STORAGE_PATH=/app/data/attachments
      - ATTACHMENT_MAX_FILE_SIZE=${ATTACHMENT_MAX_FILE_SIZE:-25MB}
      # Per-user storage cap; -1 disables it while still tracking usage.
      - ATTACHMENT_MAX_STORAGE_PER_USER=${ATTACHMENT_MAX_STORAGE_PER_USER:-2GB}
      # Multipart request limit; keep at or above ATTACHMENT_MAX_FILE_SIZE, and at or below
      # any reverse proxy's own request ceiling.
      - ATTACHMENT_MAX_REQUEST_SIZE=${ATTACHMENT_MAX_REQUEST_SIZE:-30MB}
      # Signed-URL lifetime, and an optional HMAC key (>= 32 bytes) that falls back to
      # JWT_SECRET with a startup warning when unset.
      - ATTACHMENT_URL_TTL=${ATTACHMENT_URL_TTL:-20m}
      - ATTACHMENT_SIGNING_SECRET=${ATTACHMENT_SIGNING_SECRET:-}
      # Optional: absolute base URL when files are served from a CDN or another origin.
      - ATTACHMENT_PUBLIC_BASE_URL=${ATTACHMENT_PUBLIC_BASE_URL:-}
    volumes:
      - ./api:/app
      - /app/target
      - maven_data:/root/.m2
      - attachments_data:/app/data/attachments
    depends_on:
      - postgres
    networks:
      - nextdocs-network

  nextdocs-web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: builder
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_REALTIME_URL=ws://localhost:1234
    volumes:
      - ./web:/app/web
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - ./.prettierrc:/app/.prettierrc
      - /app/web/node_modules
      - /app/web/.next
    command: npm run dev
    networks:
      - nextdocs-network

  nextdocs-realtime:
    build:
      context: .
      dockerfile: realtime/Dockerfile
      target: builder
    ports:
      - "1234:1234"
    environment:
      - PORT=1234
      - MAX_GLOBAL_CONNS=1000
    volumes:
      - ./realtime:/app/realtime
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - ./.prettierrc:/app/.prettierrc
      - /app/realtime/node_modules
      - /app/realtime/dist
    command: npm run dev
    networks:
      - nextdocs-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-nextdocs}
      - POSTGRES_USER=${POSTGRES_USER:-nextdocs}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nextdocs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nextdocs-network

networks:
  nextdocs-network:
    driver: bridge

volumes:
  postgres_data:
  maven_data:
  attachments_data:
