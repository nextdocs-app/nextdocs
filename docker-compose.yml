services:
  nextdocs-api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: dev
    ports:
      - '8080:8080'
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/nextdocs}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-nextdocs}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-nextdocs}
      # DDL is managed by Flyway; Hibernate only validates the schema
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      # JWT — must be overridden in production: openssl rand -base64 32
      - JWT_SECRET=${JWT_SECRET:-CHANGE_ME_IN_PRODUCTION}
      - JWT_ACCESS_EXPIRY_MS=${JWT_ACCESS_EXPIRY_MS:-900000}
      - JWT_REFRESH_EXPIRY_MS=${JWT_REFRESH_EXPIRY_MS:-604800000}
      # OAuth token encryption at rest (AES-GCM) — must be overridden in production
      - OAUTH_TOKEN_ENCRYPTION_KEY_BASE64=${OAUTH_TOKEN_ENCRYPTION_KEY_BASE64:-CHANGE_ME_IN_PRODUCTION}
      # CORS
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Set COOKIE_SECURE=true behind HTTPS in production
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Uploaded files live on the attachments_data volume (back up with the database)
      - ATTACHMENT_STORAGE_PATH=/app/data/attachments
      - ATTACHMENT_MAX_FILE_SIZE=${ATTACHMENT_MAX_FILE_SIZE:-25MB}
      # Per-user storage cap; -1 disables it while still tracking usage.
      - ATTACHMENT_MAX_STORAGE_PER_USER=${ATTACHMENT_MAX_STORAGE_PER_USER:-2GB}
      # Multipart request limit; keep at or above ATTACHMENT_MAX_FILE_SIZE, and at or below
      # any reverse proxy's own request ceiling.
      - ATTACHMENT_MAX_REQUEST_SIZE=${ATTACHMENT_MAX_REQUEST_SIZE:-30MB}
      # Signed-URL lifetime, and an optional HMAC key (>= 32 bytes) that falls back to
      # JWT_SECRET with a startup warning when unset.
      - ATTACHMENT_URL_TTL=${ATTACHMENT_URL_TTL:-20m}
      - ATTACHMENT_SIGNING_SECRET=${ATTACHMENT_SIGNING_SECRET:-}
      # Optional: absolute base URL when files are served from a CDN or another origin.
      - ATTACHMENT_PUBLIC_BASE_URL=${ATTACHMENT_PUBLIC_BASE_URL:-}
      # Invitations & Email
      - APP_WEB_BASE_URL=${APP_WEB_BASE_URL:-http://localhost:3000}
      # Yhub Realtime service coordination. The browser opens YHUB_WS_URL, so it is a
      # host-published URL; the API talks to the container over YHUB_BASE_URL.
      - YHUB_BASE_URL=${YHUB_BASE_URL:-http://nextdocs-realtime:1234}
      - YHUB_WS_URL=${YHUB_WS_URL:-ws://localhost:1234/api/ws/v1/nextdocs}
      # Required: the API refuses to start with the published development value.
      - YHUB_SERVICE_TOKEN=${YHUB_SERVICE_TOKEN:-}
      # Bare name on purpose: Compose omits the variable when it is unset, while
      # `${SPRING_MAIL_HOST:-}` would hand the API an empty host it must ignore.
      - SPRING_MAIL_HOST
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - SPRING_MAIL_SMTP_STARTTLS=${SPRING_MAIL_SMTP_STARTTLS:-true}
      - SPRING_MAIL_SMTP_SSL_CHECK_SERVER_IDENTITY=${SPRING_MAIL_SMTP_SSL_CHECK_SERVER_IDENTITY:-true}
      - APP_MAIL_FROM=${APP_MAIL_FROM:-NextDocs <no-reply@localhost>}
    volumes:
      - ./api:/app
      - /app/target
      - maven_data:/root/.m2
      # Uploads: keep 1 API replica unless attachments_data is shared (NFS/EFS). Back up with DB.
      - attachments_data:/app/data/attachments
    depends_on:
      - postgres
    networks:
      - nextdocs-network

  nextdocs-web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: builder
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_REALTIME_URL=ws://localhost:1234
    volumes:
      - ./web:/app/web
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - ./.prettierrc:/app/.prettierrc
      - /app/web/node_modules
      - /app/web/.next
    command: npm run dev
    networks:
      - nextdocs-network

  nextdocs-realtime:
    build:
      context: .
      dockerfile: realtime/Dockerfile
      target: builder
    ports:
      - '1234:1234'
    environment:
      - PORT=1234
      - REDIS=${REDIS:-redis://redis:6379}
      - POSTGRES=${POSTGRES:-postgres://nextdocs:nextdocs@postgres:5432/nextdocs_yhub}
      - API_BASE_URL=${API_BASE_URL:-http://nextdocs-api:8080}
      - JWT_SECRET=${JWT_SECRET:-}
      - YHUB_SERVICE_TOKEN=${YHUB_SERVICE_TOKEN:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - ./realtime:/app/realtime
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - ./.prettierrc:/app/.prettierrc
      - /app/realtime/node_modules
      - /app/realtime/dist
    command: npm run dev
    # Readiness, not liveness: a container that cannot reach Redis or Postgres has
    # no business being marked healthy, but it must not be restarted for it —
    # restarting drops every websocket it is serving. Liveness is GET /api/ping/v1.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:1234/api/health/v1').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nextdocs-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - nextdocs-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-nextdocs}
      - POSTGRES_USER=${POSTGRES_USER:-nextdocs}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nextdocs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the separate Yhub database on a fresh volume. An existing volume
      # needs `CREATE DATABASE nextdocs_yhub;` once.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/02-yhub.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nextdocs} -d ${POSTGRES_DB:-nextdocs}']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - nextdocs-network

networks:
  nextdocs-network:
    driver: bridge

volumes:
  postgres_data:
  maven_data:
  attachments_data:
  redis_data:
