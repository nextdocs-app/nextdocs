spring.application.name=nextdocs-test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
# Spring caches one context per distinct datasource/schema, and the Postgres-backed
# suites each add one. The default pool of 10 exhausts the CI database's 100 client
# slots before the migration tests run; no test needs more than a couple of connections.
spring.datasource.hikari.maximum-pool-size=4

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

spring.jackson.default-property-inclusion=non_null

app.jwt.secret=b9b457b03ccb3db67987371d78746fc267d8b2fdf408992a68b213495e5b77d3
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=604800000

app.cors.allowed-origins=http://localhost:3000

app.cookie.secure=false
app.cookie.domain=

# Mirrors the production default. The test classpath shadows src/main/resources entirely,
# so any property without a @Value default has to be repeated here.
# The main suite builds its schema through Hibernate, so the Postgres-only search
# projection (V42) does not exist here. Search beans stay wired but no SQL runs.
app.search.enabled=false

app.yhub.ws-url=ws://localhost:1234/api/ws/v1/nextdocs

app.web.base-url=http://localhost:3000

app.workspace.invite-expiry-days=7

app.rate-limit.trusted-proxies=
oauth.token.encryption.key-base64=dGVzdGtleTB0ZXN0a2V5MHRlc3RrZXkwdGVzdGtleTA=

app.attachments.storage-path=${java.io.tmpdir}/nextdocs-test-attachments
app.attachments.max-file-size=25MB
app.attachments.url-ttl=20m
app.attachments.signing-secret=test-attachment-signing-secret-0123456789abcdef

# The published dev default is rejected at startup, exactly like production.
app.yhub.service-token=test-yhub-service-token-0123456789abcdef

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
