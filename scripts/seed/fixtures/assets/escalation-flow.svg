<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img" aria-label="Escalation flow after a page">
  <rect width="640" height="260" fill="#FFFFFF"/>
  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#101828">
    <rect x="24" y="40" width="150" height="56" rx="10" fill="#EFF4FF" stroke="#1D4ED8"/>
    <text x="46" y="74">Page primary</text>
    <rect x="234" y="40" width="170" height="56" rx="10" fill="#FFFFFF" stroke="#D0D5DD"/>
    <text x="256" y="74">Ack within 15 min?</text>
    <rect x="464" y="40" width="150" height="56" rx="10" fill="#ECFDF3" stroke="#12B76A"/>
    <text x="486" y="74">Working it</text>
    <rect x="234" y="150" width="170" height="56" rx="10" fill="#FFFAEB" stroke="#FEC84B"/>
    <text x="256" y="184">Page secondary</text>
    <rect x="464" y="150" width="150" height="56" rx="10" fill="#FEF3F2" stroke="#F04438"/>
