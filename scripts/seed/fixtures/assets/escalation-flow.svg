  <g stroke="#667085" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M174 68h50"/><path d="M404 56h50"/><path d="M310 96v46"/>
  </g>
  <text x="412" y="48" font-family="Inter, Arial, sans-serif" font-size="12" fill="#027A48">yes</text>
  <text x="318" y="126" font-family="Inter, Arial, sans-serif" font-size="12" fill="#B54708">no</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#667085"/>
    </marker>
  </defs>
</svg>
