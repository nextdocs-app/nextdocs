<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-label="Ingest log and consumer offsets">
  <rect width="760" height="220" fill="#FFFFFF"/>
  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#101828">
    <text x="24" y="40" font-weight="700">harbor-ingest writes once; consumers read at their own pace</text>
    <rect x="24" y="64" width="712" height="44" rx="8" fill="#EFF4FF" stroke="#1D4ED8"/>
    <text x="40" y="92">durable event log</text>
    <rect x="24" y="132" width="200" height="52" rx="8" fill="#F2F4F7" stroke="#D0D5DD"/>
    <text x="44" y="163">consumer: warehouse</text>
    <rect x="256" y="132" width="200" height="52" rx="8" fill="#F2F4F7" stroke="#D0D5DD"/>
