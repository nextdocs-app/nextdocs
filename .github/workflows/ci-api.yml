name: CI - API

on:
  workflow_call:

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: nextdocs_test
          POSTGRES_USER: nextdocs
          POSTGRES_PASSWORD: nextdocs
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nextdocs"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nextdocs_test
      SPRING_DATASOURCE_USERNAME: nextdocs
      SPRING_DATASOURCE_PASSWORD: nextdocs
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Build and run tests
        working-directory: api
        run: ./mvnw -B verify --no-transfer-progress

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-reports
          path: api/target/surefire-reports/
          retention-days: 7

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: api
          name: api
          files: api/target/site/jacoco/jacoco.xml
          disable_search: true
          fail_ci_if_error: false

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: nextdocs_test
          POSTGRES_USER: nextdocs
          POSTGRES_PASSWORD: nextdocs
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nextdocs"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile
          push: false
          load: true
          tags: nextdocs-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Start image with production configuration
        run: |
          docker run -d --name nextdocs-api-ci --network host \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/nextdocs_test \
            -e SPRING_DATASOURCE_USERNAME=nextdocs \
            -e SPRING_DATASOURCE_PASSWORD=nextdocs \
            -e SPRING_JPA_HIBERNATE_DDL_AUTO=validate \
            -e JWT_SECRET=api-ci-jwt-secret-0123456789abcdef0123456789abcdef \
            -e OAUTH_TOKEN_ENCRYPTION_KEY_BASE64=dGVzdGtleTB0ZXN0a2V5MHRlc3RrZXkwdGVzdGtleTA= \
            -e YHUB_SERVICE_TOKEN=api-ci-service-token-0123456789abcdef \
            -e SEARCH_ENABLED=false \
            -e YHUB_PURGE_ENABLED=false \
            -e ATTACHMENT_STORAGE_PATH=/tmp/nextdocs-attachments \
            nextdocs-api:ci

          for _ in $(seq 1 90); do
            if ! docker inspect -f '{{.State.Running}}' nextdocs-api-ci | grep -q true; then
              echo "API container exited before it became ready"
              docker logs nextdocs-api-ci || true
              exit 1
            fi
            if curl -fsS http://127.0.0.1:8080/api/v1/instance/status >/dev/null; then
              echo "API image is serving HTTP 200"
              exit 0
            fi
            sleep 2
          done
          echo "API image did not become ready"
          docker logs nextdocs-api-ci || true
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs nextdocs-api-ci || true

      - name: Remove container
        if: always()
        run: docker rm -f nextdocs-api-ci || true
