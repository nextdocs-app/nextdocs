name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  merge_group:
  schedule:
    # Nightly full suite: catches dependency/registry drift that path-filtered PRs miss.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  # PR runs share a group per PR so a new push replaces the old run. Every other
  # event gets its own group: a shared group would queue main pushes behind each
  # other and let a third pending run cancel the second, which must finish.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # Every commit on main and every merge-queue batch must finish; PR runs can be replaced.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  HUSKY: 0

jobs:
  changes:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      web: ${{ steps.resolve.outputs.web }}
      realtime: ${{ steps.resolve.outputs.realtime }}
      api: ${{ steps.resolve.outputs.api }}
      e2e: ${{ steps.resolve.outputs.e2e }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate workspace lockfile policy
        run: pnpm run check:lockfiles

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm run audit

      - name: Check root formatting
        run: pnpm run format:root

      - name: Check runtime version pins
        run: pnpm run check:runtime-versions

      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - "web/**"
              - "realtime/src/types/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "tsconfig.base.json"
              - ".prettierrc"
              - ".editorconfig"
              - ".nvmrc"
              - "scripts/**"
              - "codecov.yml"
              - "docker/**"
              - "docker-compose.yml"
              - ".dockerignore"
              - ".github/workflows/**"
            realtime:
              - "realtime/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "tsconfig.base.json"
              - ".prettierrc"
              - ".editorconfig"
              - ".nvmrc"
              - "scripts/**"
              - "codecov.yml"
              - "docker/**"
              - "docker-compose.yml"
              - ".dockerignore"
              - ".github/workflows/**"
            api:
              - "api/**"
              - ".java-version"
              - "codecov.yml"
              - "docker/**"
              - "docker-compose.yml"
              - ".github/workflows/**"
            # The CLI's tests cover its own scripts only; a change elsewhere cannot break
            # them, and they need neither Docker nor the services.
            cli:
              - "scripts/**"
              - "package.json"
            # The browser suite drives all three services, so it follows the union
            # of the paths that can change what they serve. Formatting-only files
            # and dev tooling are left out: they cannot change the running app.
            e2e:
              - "e2e/**"
              - "web/**"
              - "realtime/**"
              - "api/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "tsconfig.base.json"
              - ".nvmrc"
              - ".java-version"
              - "docker/**"
              - "docker-compose.yml"
              - ".dockerignore"
              - ".github/workflows/**"

      - name: Resolve service flags
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          WEB: ${{ steps.filter.outputs.web }}
          REALTIME: ${{ steps.filter.outputs.realtime }}
          API: ${{ steps.filter.outputs.api }}
          E2E: ${{ steps.filter.outputs.e2e }}
          CLI: ${{ steps.filter.outputs.cli }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            web=${WEB:-false}
            realtime=${REALTIME:-false}
            api=${API:-false}
            e2e=${E2E:-false}
            cli=${CLI:-false}
          else
            # main pushes, merge queues, schedules, and manual runs get everything.
            web=true
            realtime=true
            api=true
            e2e=true
            cli=true
          fi
          {
            echo "web=$web"
            echo "realtime=$realtime"
            echo "api=$api"
            echo "e2e=$e2e"
            echo "cli=$cli"
          } >> "$GITHUB_OUTPUT"

      - name: Test development CLI
        if: steps.resolve.outputs.cli == 'true'
        run: pnpm run test:scripts

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/ci-web.yml
    secrets: inherit

  realtime:
    name: Realtime
    needs: changes
    if: needs.changes.outputs.realtime == 'true'
    uses: ./.github/workflows/ci-realtime.yml
    secrets: inherit

  api:
    name: API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/ci-api.yml
    secrets: inherit

  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/ci-e2e.yml
    secrets: inherit

  required:
    name: Required checks
    if: always()
    needs: [changes, web, realtime, api, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Evaluate job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node - <<'NODE'
          const needs = JSON.parse(process.env.NEEDS);
          const services = ['web', 'realtime', 'api', 'e2e'];
          const problems = [];

          if (needs.changes?.result !== 'success') {
            problems.push(`changes: ${needs.changes?.result ?? 'missing'}`);
          }

          for (const id of services) {
            const result = needs[id]?.result ?? 'missing';
            if (result === 'failure' || result === 'cancelled' || result === 'missing') {
              problems.push(`${id}: ${result}`);
            }
            if (result === 'skipped' && needs.changes?.outputs?.[id] === 'true') {
              problems.push(`${id}: skipped despite a matching change`);
            }
          }

          if (problems.length > 0) {
            console.error('Required checks failed:');
            for (const problem of problems) console.error(`- ${problem}`);
            process.exit(1);
          }

          const skipped = services.filter((id) => needs[id]?.result === 'skipped');
          console.log(
            `All required checks passed${skipped.length ? ` (skipped: ${skipped.join(', ')})` : ''}.`
          );
          NODE
