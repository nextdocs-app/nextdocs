name: CI - Realtime

on:
  workflow_call:

permissions:
  contents: read

env:
  HUSKY: 0
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nextdocs
          POSTGRES_PASSWORD: nextdocs
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextdocs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES: postgres://nextdocs:nextdocs@localhost:5432/nextdocs_yhub
      REDIS: redis://localhost:6379
      JWT_SECRET: integration-jwt-secret-0123456789abcdef
      YHUB_SERVICE_TOKEN: integration-service-token-0123456789abcdef
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate workspace lockfile policy
        run: pnpm run check:lockfiles

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint, and build
        run: pnpm exec turbo run format lint build --filter=realtime

      - name: Run tests with coverage
        run: pnpm --filter realtime run test:coverage --ci

      - name: Rebase coverage paths to the repository root
        if: ${{ !cancelled() }}
        run: node scripts/coverage-paths.js realtime

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: realtime
          name: realtime
          files: realtime/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false

      - name: Run integration tests
        run: pnpm --filter realtime run test:integration --ci

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nextdocs
          POSTGRES_PASSWORD: nextdocs
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextdocs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES: postgres://nextdocs:nextdocs@localhost:5432/nextdocs_yhub
      REDIS: redis://localhost:6379
      JWT_SECRET: integration-jwt-secret-0123456789abcdef
      YHUB_SERVICE_TOKEN: integration-service-token-0123456789abcdef
      REALTIME_IMAGE: nextdocs-realtime:it
      DOCKER_TESTS: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build realtime server for integration setup
        run: pnpm --filter realtime build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./realtime/Dockerfile
          push: false
          load: true
          tags: nextdocs-realtime:it
          cache-from: type=gha,scope=realtime
          cache-to: type=gha,mode=max,scope=realtime

      - name: Run Docker image tests
        run: pnpm --filter realtime run test:integration --ci tests/integration/docker-image.test.ts

      - name: Show container state on failure
        if: failure()
        run: |
          docker ps -a
          for container in $(docker ps -aq --filter name=nextdocs-realtime-it-); do
            echo "--- logs: $container"
            docker logs "$container" || true
          done
