name: CI - Web

on:
  workflow_call:

permissions:
  contents: read

env:
  HUSKY: 0
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate workspace lockfile policy
        run: npm run check:lockfiles

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Check formatting and lint
        run: npx turbo run format lint --filter=web

      - name: Run tests with coverage
        run: npm run test:coverage -w web -- --ci

      - name: Rebase coverage paths to the repository root
        if: ${{ !cancelled() }}
        run: node scripts/coverage-paths.js web

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: web
          name: web
          files: web/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false

      - name: Build
        run: npx turbo run build --filter=web

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./web/Dockerfile
          push: false
          load: true
          tags: nextdocs-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Start image and wait for HTTP 200
        run: |
          docker run -d --name nextdocs-web-ci -p 3000:3000 nextdocs-web:ci
          for _ in $(seq 1 60); do
            if ! docker inspect -f '{{.State.Running}}' nextdocs-web-ci | grep -q true; then
              echo "web container exited before it became ready"
              docker logs nextdocs-web-ci || true
              exit 1
            fi
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            if [ "$status" = "200" ]; then
              echo "web image is serving HTTP 200"
              exit 0
            fi
            sleep 2
          done
          echo "web image did not become ready"
          docker logs nextdocs-web-ci || true
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs nextdocs-web-ci || true

      - name: Remove container
        if: always()
        run: docker rm -f nextdocs-web-ci || true
