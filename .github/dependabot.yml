version: 2

updates:
  # npm dependencies (root monorepo + workspaces)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      web-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "npm"
    # Yjs 14 publishes two prerelease lines and dependabot reads the older
    # numbered one (`14.0.0-22`) as newer than `14.0.0-rc.30`: semver ranks
    # numeric prerelease identifiers below alphanumeric ones. A range filter on
    # that line did not stop #165, so the dependency is ignored outright.
    # Upgrades are taken by hand next to `@y/hub`, which decides the line this
    # service can run: the lines renamed the type API (`Y.Node`) and two copies
    # break the `instanceof` checks across the Yhub boundary.
    ignore:
      - dependency-name: "@y/y"

  # Maven dependencies (API service)
  - package-ecosystem: "maven"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      java-dependencies:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "java"

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      ci-dependencies:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "ci"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/api"
    schedule:
      interval: "monthly"
    groups:
      docker-api:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/web"
    schedule:
      interval: "monthly"
    groups:
      docker-web:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/realtime"
    schedule:
      interval: "monthly"
    groups:
      docker-realtime:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "docker"
