version: 2

# Dependabot security updates are a repository setting, not a key in this file:
# Settings -> Code security -> Dependabot security updates. They complement the
# `pnpm run audit` CI gate by opening a fix PR when an advisory lands, instead of
# waiting for the weekly grouped version update. Alerts accepted in
# pnpm-workspace.yaml#auditConfig.ignoreGhsas must also be dismissed in GitHub,
# or Dependabot will keep trying to patch them.

updates:
  # pnpm dependencies (root workspace + web/realtime); dependabot reads pnpm-lock.yaml
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      javascript-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
    labels:
      - 'dependencies'
      - 'pnpm'
    commit-message:
      prefix: 'build'
      include: 'scope'
    # Yjs 14 publishes two prerelease lines and dependabot reads the older
    # numbered one (`14.0.0-22`) as newer than `14.0.0-rc.30`: semver ranks
    # numeric prerelease identifiers below alphanumeric ones. A range filter on
    # that line did not stop #165, so the dependency is ignored outright.
    # Upgrades are taken by hand next to `@y/hub`, which decides the line this
    # service can run: the lines renamed the type API (`Y.Node`) and two copies
    # break the `instanceof` checks across the Yhub boundary.
    ignore:
      - dependency-name: '@y/y'

  # Maven dependencies (API service)
  - package-ecosystem: 'maven'
    directory: '/api'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      java-dependencies:
        patterns: ['*']
    labels:
      - 'dependencies'
      - 'java'
    commit-message:
      prefix: 'build'
      include: 'scope'

  # GitHub Actions versions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      ci-dependencies:
        patterns: ['*']
    labels:
      - 'dependencies'
      - 'ci'
    commit-message:
      prefix: 'build'
      include: 'scope'

  # Docker base images per service
  - package-ecosystem: 'docker'
    directory: '/api'
    schedule:
      interval: 'monthly'
    groups:
      docker-api:
        patterns: ['*']
    labels:
      - 'dependencies'
      - 'docker'
    commit-message:
      prefix: 'build'
      include: 'scope'

  - package-ecosystem: 'docker'
    directory: '/web'
    schedule:
      interval: 'monthly'
    groups:
      docker-web:
        patterns: ['*']
    labels:
      - 'dependencies'
      - 'docker'
    commit-message:
      prefix: 'build'
      include: 'scope'

  - package-ecosystem: 'docker'
    directory: '/realtime'
    schedule:
      interval: 'monthly'
    groups:
      docker-realtime:
        patterns: ['*']
    labels:
      - 'dependencies'
      - 'docker'
    commit-message:
      prefix: 'build'
      include: 'scope'

  # Compose-only images (Postgres, Redis, Mailpit). Dependabot needs the
  # dedicated ecosystem to read docker-compose.yml; `docker` only reads Dockerfiles.
  - package-ecosystem: 'docker-compose'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    groups:
      docker-compose:
        patterns: ['*']
    labels:
      - 'dependencies'
      - 'docker'
    commit-message:
      prefix: 'build'
      include: 'scope'
